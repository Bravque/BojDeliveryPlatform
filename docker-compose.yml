# Local development dependencies. Not for production use.
# Start with: docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: boj-mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root_local_pw
      MYSQL_DATABASE: boj_dev
      MYSQL_USER: boj
      MYSQL_PASSWORD: boj_local_pw
    volumes:
      - boj_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot_local_pw']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: boj-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    container_name: boj-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: boj_minio
      MINIO_ROOT_PASSWORD: boj_minio_local_pw
    volumes:
      - boj_minio_data:/data

volumes:
  boj_mysql_data:
  boj_minio_data:
